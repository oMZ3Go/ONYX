name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  landing:
    runs-on: ubuntu-latest
    # The 165-case production browser suite has taken 27.5 minutes locally.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
